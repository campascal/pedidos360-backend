
services:
  rabbitmq1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq1
    container_name: pedidos360-rabbitmq1
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  rabbitmq2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq2
    container_name: pedidos360-rabbitmq2
    restart: unless-stopped
    depends_on:
      rabbitmq1:
        condition: service_healthy
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  pedidos-service:
    build:
      context: ../pedidos-service
    restart: unless-stopped
    depends_on:
      rabbitmq1:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - pedidos360-network

  productos-service:
    build:
      context: ../productos-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - pedidos360-network

  rabbitmq-admin-service:
    build:
      context: ../rabbitmq-admin-service
    restart: unless-stopped
    depends_on:
      rabbitmq1:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      ADMIN_API_USER: ${ADMIN_API_USER}
      ADMIN_API_PASSWORD: ${ADMIN_API_PASSWORD}
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - pedidos360-network

networks:
  pedidos360-network:
    driver: bridge

volumes:
  rabbitmq1_data:
  rabbitmq2_data:
